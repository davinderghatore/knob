<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="-48 -48 96 96" role="img" aria-label="Knob">
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565A61"/>
      <stop offset="1" stop-color="#1C1E21"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#52565C"/>
      <stop offset="1" stop-color="#26282C"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle r="40" fill="none" stroke="#5C6168" stroke-opacity="0.4" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="188.5 400" transform="rotate(135)"/>
  <circle r="40" fill="none" stroke="#FF6B1F" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="128 400" transform="rotate(135)" filter="url(#glow)"/>
  <circle r="31" fill="url(#skirt)" stroke="#000" stroke-opacity="0.6" stroke-width="1"/>
  <circle r="26" fill="url(#cap)"/>
  <g transform="rotate(48)"><rect x="-1.6" y="-23" width="3.2" height="11" rx="1.6" fill="#F2F2F2"/></g>
</svg>
